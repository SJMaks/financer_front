name: Deploy to VM

on:
  push:
    branches: [main]
  workflow_dispatch:

# Деплои выполняются строго по одному (параллельные запуски отменяются)
concurrency:
  group: deploy-vm
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Каталог на VM, куда копируется dist/ (настраивается переменной DEPLOY_PATH)
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/financer' }}

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${VM_PORT:-22}" "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Deploy dist to VM via rsync
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PORT: ${{ secrets.VM_SSH_PORT }}
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${VM_PORT:-22} -o StrictHostKeyChecking=yes" \
            dist/ "${VM_USER}@${VM_HOST}:${DEPLOY_PATH}/"
